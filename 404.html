<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lost in space | Amirisetti Shree Pranay Sidhartha</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#05060f" />
  <link rel="icon" id="favicon" href="assets/favicon.svg" type="image/svg+xml" />
  <style>
    :root {
      --text: #e9edff;
      --muted: #98a1c6;
      --accent: #7c8cff;
      --accent-2: #4ce0ff;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem;
      text-align: center;
      color: var(--text);
      background: radial-gradient(circle at 50% 25%, #0d1330 0%, #05060f 60%);
      font-family: "Space Grotesk", "Segoe UI", system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    main { position: relative; z-index: 1; max-width: 34rem; }
    .code {
      font-size: clamp(4.5rem, 18vw, 8rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.05em;
      background: linear-gradient(105deg, var(--accent-2), var(--accent) 55%, #b07cff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    h1 { margin: 1rem 0 0; font-size: clamp(1.2rem, 3vw, 1.6rem); font-weight: 600; }
    p { margin: 0.85rem 0 0; color: var(--muted); line-height: 1.7; }
    .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; margin-top: 2rem; }
    a {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      min-height: 46px;
      padding: 0 1.35rem;
      border-radius: 999px;
      font-size: 0.94rem;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    }
    a:hover { transform: translateY(-2px); }
    .primary {
      color: #05060f;
      background: linear-gradient(120deg, var(--accent), var(--accent-2));
      box-shadow: 0 16px 36px -18px var(--accent);
    }
    .ghost { color: var(--text); border: 1px solid rgba(146, 162, 255, 0.32); }
    .ghost:hover { border-color: var(--accent); }
    @media (prefers-reduced-motion: reduce) { canvas { display: none; } }
  </style>
</head>
<body>
  <canvas id="space" aria-hidden="true"></canvas>

  <main>
    <p class="code">404</p>
    <h1>This page drifted out of orbit</h1>
    <p>The address you followed doesn't exist on this site. Nothing is broken — you just took a wrong turn near a small blue planet.</p>
    <div class="actions">
      <a class="primary" id="homeLink" href="/">Back to home base</a>
      <a class="ghost" href="javascript:history.back()">Go back</a>
    </div>
  </main>

  <script>
    // Keep the home link correct whether the site is served from a domain root
    // or from a GitHub Pages project subpath (e.g. /my-repo/).
    (function () {
      // The site may be served from a domain root or from a project subpath.
      // Update KNOWN_PROJECT_PATH if you rename the repository.
      var KNOWN_PROJECT_PATH = "/Sidharth_Amirisetti.github.io/";
      var base = window.location.pathname.indexOf(KNOWN_PROJECT_PATH) === 0 ? KNOWN_PROJECT_PATH : "/";

      var link = document.getElementById("homeLink");
      if (link) link.setAttribute("href", base);

      var favicon = document.getElementById("favicon");
      if (favicon) favicon.setAttribute("href", base + "assets/favicon.svg");

      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

      var canvas = document.getElementById("space");
      var ctx = canvas.getContext("2d");
      var stars = [];

      function resize() {
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        stars = [];
        var count = Math.min(140, Math.round((window.innerWidth * window.innerHeight) / 11000));
        for (var i = 0; i < count; i++) {
          stars.push({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            r: 0.4 + Math.random() * 1.4,
            phase: Math.random() * Math.PI * 2,
            speed: 0.4 + Math.random() * 1.4
          });
        }
      }

      function draw(time) {
        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
        for (var i = 0; i < stars.length; i++) {
          var s = stars[i];
          var alpha = 0.3 + 0.7 * Math.abs(Math.sin(time * 0.001 * s.speed + s.phase));
          ctx.fillStyle = "rgba(228, 238, 255, " + alpha.toFixed(2) + ")";
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fill();
        }
        window.requestAnimationFrame(draw);
      }

      window.addEventListener("resize", resize);
      resize();
      window.requestAnimationFrame(draw);
    })();
  </script>
</body>
</html>
